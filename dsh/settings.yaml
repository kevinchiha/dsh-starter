# Model a fresh agent starts on (web sessions and `dsh --profile headless`).
# Switch it from the terminal with: dsh-model <id>
agent-default-model:
  provider: claude
  model: claude-fable-5-1
  reasoningEffort: xhigh
llm-pi-ai:
  providers:
    # Every route below points at the local CLIProxyAPI on 127.0.0.1:8317 and
    # authenticates with the CLIPROXYAPI_KEY reference in ~/.dsh/.credentials.yaml.
    # Each `models` list replaces the installed pi-ai catalog for that route, so
    # it names exactly what the proxy serves.

    # Every Claude model CLIProxyAPI serves, declared by hand rather than taken
    # from pi-ai's catalog. The catalog marks Opus 5 and Fable 5.1
    # `supportsMidConvoEffort`, which makes pi-ai interleave
    # `{role: system, output_config: {effort}}` markers between messages; the
    # proxy's upstream refuses those with "messages.N.output_config: Extra
    # inputs are not permitted", and that switch cannot be turned off from
    # settings. A hand-declared route inherits no catalog compat, so the markers
    # are never sent. Everything else here mirrors what the catalog records.
    claude:
      displayName: Claude (CLIProxyAPI)
      apiKeyEnv: CLIPROXYAPI_KEY
      api: anthropic-messages
      baseURL: http://127.0.0.1:8317
      defaultMaxTokens: 64000
      models:
        - id: claude-opus-5
          name: Claude Opus 5
          contextWindow: 1000000
          input: [ text, image ]
          reasoningEfforts:
            "off":
            xhigh: xhigh
            max: max
          compat:
            forceAdaptiveThinking: true
            supportsTemperature: false
            supportsStrictTools: true
        - id: claude-opus-4-8
          name: Claude Opus 4.8
          contextWindow: 1000000
          input: [ text, image ]
          reasoningEfforts:
            xhigh: xhigh
            max: max
          compat:
            forceAdaptiveThinking: true
            supportsTemperature: false
            supportsStrictTools: true
        - id: claude-opus-4-7
          name: Claude Opus 4.7
          contextWindow: 1000000
          input: [ text, image ]
          reasoningEfforts:
            xhigh: xhigh
            max: max
          compat:
            forceAdaptiveThinking: true
            supportsTemperature: false
            supportsStrictTools: true
        - id: claude-opus-4-6
          name: Claude Opus 4.6
          contextWindow: 1000000
          input: [ text, image ]
          reasoningEfforts:
            max: max
          compat:
            forceAdaptiveThinking: true
            supportsStrictTools: true
        - id: claude-opus-4-5-20251101
          name: Claude Opus 4.5
          contextWindow: 200000
          input: [ text, image ]
          reasoningEfforts:
            low: low
            medium: medium
            high: high
          compat:
            supportsStrictTools: true
        - id: claude-sonnet-5
          name: Claude Sonnet 5
          contextWindow: 1000000
          input: [ text, image ]
          reasoningEfforts:
            xhigh: xhigh
            max: max
          compat:
            forceAdaptiveThinking: true
            supportsStrictTools: true
        - id: claude-sonnet-4-6
          name: Claude Sonnet 4.6
          contextWindow: 1000000
          input: [ text, image ]
          reasoningEfforts:
            max: max
          compat:
            forceAdaptiveThinking: true
            supportsStrictTools: true
        - id: claude-sonnet-4-5-20250929
          name: Claude Sonnet 4.5
          contextWindow: 1000000
          input: [ text, image ]
          reasoningEfforts:
            low: low
            medium: medium
            high: high
          compat:
            supportsStrictTools: true
        - id: claude-haiku-4-5-20251001
          name: Claude Haiku 4.5
          contextWindow: 200000
          input: [ text, image ]
          reasoningEfforts:
            low: low
            medium: medium
            high: high
          compat:
            supportsStrictTools: true
        - id: claude-fable-5-1
          name: Claude Fable 5.1
          contextWindow: 1000000
          input: [ text, image ]
          # No "off" entry: these models are adaptive-thinking-only. Declaring it
          # lets an effort resolution reach thinking.type.disabled, which the
          # upstream rejects with HTTP 400 and kills every dispatch.
          reasoningEfforts:
            xhigh: xhigh
            max: max
          compat:
            forceAdaptiveThinking: true
            supportsStrictTools: true
        - id: claude-fable-5
          name: Claude Fable 5
          contextWindow: 1000000
          input: [ text, image ]
          # No "off" entry: these models are adaptive-thinking-only. Declaring it
          # lets an effort resolution reach thinking.type.disabled, which the
          # upstream rejects with HTTP 400 and kills every dispatch.
          reasoningEfforts:
            xhigh: xhigh
            max: max
          compat:
            forceAdaptiveThinking: true
            supportsStrictTools: true

    # No ChatGPT subscription? Delete this whole `openai:` block, and the four
    # `provider: openai` entries under `subagent-model-selection` at the end of the
    # file. Otherwise six GPT models sit in the picker and every one of them fails.
    openai:
      displayName: OpenAI (CLIProxyAPI)
      apiKeyEnv: CLIPROXYAPI_KEY
      api: openai-responses
      baseURL: http://127.0.0.1:8317/v1
      models:
        - id: gpt-6-astra
        - id: gpt-5.6-terra
        - id: gpt-5.6-sol
        - id: gpt-5.6-luna
        - id: gpt-5.5
        - id: codex-auto-review
          name: Codex Auto Review
          contextWindow: 272000
          input: [ text, image ]

permission:
  defaultPreset: danger-full-access

# Web search for the web_search tool. The shipped provider is labelled "DeepSeek"
# but it is a generic Anthropic Messages client that asks for the server-side
# `web_search_20250305` tool, and CLIProxyAPI passes that tool straight through
# to Claude. So this routes searches to the same engine Claude Code's WebSearch
# uses, on the Claude subscriptions, with no DeepSeek key. Haiku is the cheapest
# model that can drive the search; the model only forwards the query and
# returns citations, so a bigger one buys nothing. web_fetch needs no key: the
# anonymous HTTP fetcher from the base bundle handles it.
web-search-deepseek:
  apiKeyEnv: CLIPROXYAPI_KEY
  baseURL: http://127.0.0.1:8317/v1
  model: claude-haiku-4-5-20251001
agent-presets:
  default: standard
dsh-better-sidebar:
  tabsEnabled:
    browser: false
ui-theme:
  preference: dark
subagent-model-selection:
  enabled: true
  allowedModels:
    - provider: claude
      model: claude-opus-5
    - provider: claude
      model: claude-sonnet-5
    - provider: claude
      model: claude-fable-5-1
    - provider: openai
      model: gpt-6-astra
    - provider: openai
      model: gpt-5.6-terra
    - provider: openai
      model: gpt-5.6-sol
    - provider: openai
      model: gpt-5.6-luna
    - provider: claude
      model: claude-haiku-4-5-20251001
