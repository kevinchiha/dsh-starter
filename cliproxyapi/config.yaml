host: "127.0.0.1"
port: 8317
auth-dir: "~/.cli-proxy-api"
api-keys:
  - "REPLACE_WITH_RANDOM_KEY"
debug: false
logging-to-file: false
usage-statistics-enabled: false

# Rotate between multiple Claude subscription logins.
# fill-first drains one account until it is rate-limited, then moves to the next.
# session-affinity pins a single conversation to one account so prompt caching survives.
routing:
  strategy: "fill-first"
  session-affinity: true
  session-affinity-ttl: "1h"
